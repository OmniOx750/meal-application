<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>사내 식수 신청</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero compact">
      <div>
        <p class="eyebrow" id="companyName">우리 회사</p>
        <h1 id="appTitle">사내 식수 신청</h1>
        <p class="hero-date" id="todayLabel">날짜를 불러오는 중입니다.</p>
      </div>
      <a class="text-link" href="admin.html">관리자</a>
    </header>

    <section id="loadingCard" class="card status-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>오늘의 메뉴와 마감시간을 불러오고 있습니다.</p>
    </section>

    <section id="closedCard" class="card status-card hidden">
      <span class="status-icon">!</span>
      <div>
        <h2>오늘은 신청을 받지 않습니다.</h2>
        <p id="closedReason">관리자 설정을 확인해주세요.</p>
      </div>
    </section>

    <form id="mealForm" class="hidden" novalidate>
      <section class="card identity-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">신청자 정보</p>
            <h2>이름과 부서를 입력해주세요</h2>
          </div>
          <button type="button" class="button ghost small" id="loadPreviousButton">기존 신청 불러오기</button>
        </div>

        <div class="field-grid two">
          <label class="field">
            <span>이름</span>
            <input id="employeeName" name="employeeName" maxlength="30" autocomplete="name" placeholder="예: 홍길동" required>
          </label>
          <label class="field">
            <span>부서</span>
            <input id="department" name="department" maxlength="40" autocomplete="organization-title" placeholder="예: 마케팅팀" required>
          </label>
        </div>
        <p class="helper">같은 날짜·이름·부서로 다시 제출하면 기존 신청 내용이 수정됩니다.</p>
      </section>

      <section class="meal-grid">
        <article class="card meal-card" id="lunchCard">
          <div class="meal-heading">
            <div>
              <p class="eyebrow">LUNCH</p>
              <h2>중식</h2>
            </div>
            <span class="pill" id="lunchState">확인 중</span>
          </div>
          <div class="menu-box">
            <span>오늘의 메뉴</span>
            <strong id="lunchMenu">-</strong>
          </div>
          <p class="deadline" id="lunchDeadline">마감시간 -</p>
          <fieldset class="choice-group" id="lunchChoices">
            <legend class="sr-only">중식 신청 여부</legend>
            <label class="choice">
              <input type="radio" name="lunch" value="신청">
              <span>신청</span>
            </label>
            <label class="choice">
              <input type="radio" name="lunch" value="미신청">
              <span>미신청</span>
            </label>
          </fieldset>
        </article>

        <article class="card meal-card" id="dinnerCard">
          <div class="meal-heading">
            <div>
              <p class="eyebrow">DINNER</p>
              <h2>석식</h2>
            </div>
            <span class="pill" id="dinnerState">확인 중</span>
          </div>
          <div class="menu-box">
            <span>오늘의 메뉴</span>
            <strong id="dinnerMenu">-</strong>
          </div>
          <p class="deadline" id="dinnerDeadline">마감시간 -</p>
          <fieldset class="choice-group" id="dinnerChoices">
            <legend class="sr-only">석식 신청 여부</legend>
            <label class="choice">
              <input type="radio" name="dinner" value="신청">
              <span>신청</span>
            </label>
            <label class="choice">
              <input type="radio" name="dinner" value="미신청">
              <span>미신청</span>
            </label>
          </fieldset>
        </article>
      </section>

      <section id="noticeCard" class="notice hidden"></section>

      <button class="button primary full" id="submitButton" type="submit">신청 내용 저장</button>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
